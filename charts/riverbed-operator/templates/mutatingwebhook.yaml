apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: {{ .Values.namespace }}/riverbed-operator-serving-cert
  name: riverbed-operator-mutating-webhook-configuration
  labels:
    app.kubernetes.io/component: webhook
    app.kubernetes.io/created-by: riverbed-operator
    app.kubernetes.io/instance: mutating-webhook-configuration
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: mutatingwebhookconfiguration
    app.kubernetes.io/part-of: riverbed-operator
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: riverbed-operator-webhook-service
      namespace: {{ .Values.namespace }}
      path: /mutate--v1-pod
  failurePolicy: Ignore
  name: mpod-v1.kb.io
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - pods
  sideEffects: None 