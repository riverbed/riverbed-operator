apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: riverbed-operator-manager-role
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: riverbed-operator
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - events
  - nodes
  - pods
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - namespaces
  - serviceaccounts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - replicasets
  - statefulsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - operator.riverbed
  resources:
  - riverbedoperators
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - operator.riverbed
  resources:
  - riverbedoperators/finalizers
  verbs:
  - update
- apiGroups:
  - operator.riverbed
  resources:
  - riverbedoperators/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterrolebindings
  - clusterroles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch 