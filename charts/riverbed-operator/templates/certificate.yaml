apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: riverbed-operator-serving-cert
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/component: certificate
    app.kubernetes.io/created-by: riverbed-operator
    app.kubernetes.io/instance: serving-cert
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: certificate
    app.kubernetes.io/part-of: riverbed-operator
spec:
  dnsNames:
  - riverbed-operator-webhook-service.{{ .Values.namespace }}.svc
  - riverbed-operator-webhook-service.{{ .Values.namespace }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: riverbed-operator-selfsigned-issuer
  secretName: webhook-server-cert 