apiVersion: v1
kind: Service
metadata:
  name: riverbed-operator-webhook-service
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/component: webhook
    app.kubernetes.io/created-by: riverbed-operator
    app.kubernetes.io/instance: webhook-service
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: service
    app.kubernetes.io/part-of: riverbed-operator
spec:
  ports:
    - port: {{ .Values.service.webhookServicePort }}
      protocol: TCP
      targetPort: {{ .Values.service.webhookPort }}
  selector:
    control-plane: controller-manager 